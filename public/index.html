<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1a0512">
<title>De Dart Struners</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--bg:light-dark(#fff3f8,#14060e);--ink:light-dark(#22061a,#ffeaf4);--mut:light-dark(#8c5873,#c99ab3);--line:light-dark(#f7cde0,#3a1429);--card:light-dark(#ffffff,#230a18);--pink:#ff2d8a;--pink2:#c40f63;--hl:#ffe14d;--deep:#1a0512;--pinkt:light-dark(#c8136a,#ff2d8a)}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,.cond{font-family:Anton,Impact,sans-serif;font-weight:400;letter-spacing:.01em}
.hero{background:radial-gradient(60% 90% at 78% 40%,#7a0f4a 0,transparent 70%),radial-gradient(40% 60% at 10% 100%,#4a0a2e 0,transparent 70%),var(--deep);color:#fff;position:relative;overflow:hidden}
.hin{max-width:1240px;margin:0 auto;padding:24px max(5vw,16px) 0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);align-items:center;gap:8px}
h1{margin:0;font-size:clamp(44px,9vw,92px);line-height:.95;text-transform:uppercase}
h1 span{display:block;color:var(--pink);text-shadow:0 0 28px rgba(255,45,138,.55)}
.sub{color:#f5bfd8;font-size:15px;margin:14px 0 0;max-width:34ch}
.logo{width:100%;max-height:340px;display:block;filter:drop-shadow(0 18px 30px rgba(0,0,0,.45))}
nav{display:flex;gap:8px;flex-wrap:wrap;max-width:1240px;margin:0 auto;padding:18px max(5vw,16px) 20px}
nav button{font:800 15px Inter,sans-serif;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#ffd6e8;padding:0 18px;min-height:44px;border-radius:999px;cursor:pointer}
nav button.on{background:var(--pink);border-color:var(--pink);color:#fff;box-shadow:0 6px 20px rgba(255,45,138,.45)}
nav button:disabled{opacity:.35;cursor:default}
main{padding:28px max(5vw,16px) 56px;max-width:1240px;margin:0 auto}
h2{font-size:clamp(28px,5vw,40px);margin:0 0 12px;line-height:1.05;text-transform:uppercase}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select{font:16px Inter,sans-serif;padding:10px 14px;min-height:48px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
input:focus{border-color:var(--pink);outline:none}
input[type=text],input[type=password]{flex:1 1 200px}
.btn{font:800 15px Inter,sans-serif;min-height:48px;padding:0 20px;border-radius:999px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
.btn.pri{background:var(--pink);border-color:var(--pink);color:#fff;box-shadow:0 8px 22px rgba(255,45,138,.35)}
.btn:disabled{opacity:.4;cursor:default;box-shadow:none}
:focus-visible{outline:3px solid var(--hl);outline-offset:2px}
.list{list-style:none;padding:0;margin:16px 0;display:grid;gap:8px;max-width:560px}
.list li{display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:4px 4px 4px 10px}
.list .sd{font:22px Anton,sans-serif;color:#fff;background:var(--pink);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none}
.list .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.x{width:44px;height:44px;border:0;background:none;color:var(--mut);font-size:24px;cursor:pointer;border-radius:50%}
.x:hover{background:var(--line)}
.set{display:flex;gap:16px;flex-wrap:wrap;margin:8px 0 18px;color:var(--mut);font-size:14px;font-weight:600}
.set label{display:flex;flex-direction:column;gap:4px}
.empty{color:var(--mut);padding:20px 0}
.scroll{overflow-x:auto;padding-bottom:14px}
.br{display:flex;gap:22px;min-width:max-content}
.col{display:flex;flex-direction:column;width:240px}
.col h3{font:20px Anton,sans-serif;margin:0 0 12px;color:var(--pinkt);text-transform:uppercase;letter-spacing:.02em}
.ms{display:flex;flex-direction:column;justify-content:space-around;gap:16px;flex:1}
.m{background:var(--card);border-radius:16px;border:2px solid var(--line);overflow:hidden}
.m.ready{border-color:var(--pink);box-shadow:0 0 0 4px rgba(255,45,138,.14),0 10px 24px rgba(255,45,138,.18)}
.m.final{border-color:var(--pink);background:linear-gradient(160deg,rgba(255,45,138,.14),transparent 60%),var(--card)}
.mh{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);padding:8px 12px 2px;font-weight:800}
.mh span:last-child{color:var(--pinkt)}
.pr{display:flex;align-items:center;gap:2px;padding:2px 6px 2px 12px;min-height:48px}
.pr+.pr{border-top:1px dashed var(--line)}
.pr .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:800;font-size:15px}
.pr.wait .nm{color:var(--mut);font-weight:400;font-style:italic;font-size:14px}
.pr.lose .nm{color:var(--mut);text-decoration:line-through;text-decoration-thickness:1px}
.pr b{font:26px Anton,sans-serif;width:36px;height:36px;display:grid;place-items:center;font-weight:400}
.pr.win b{background:radial-gradient(circle at 35% 30%,#ffc2dd,var(--pink) 55%,var(--pink2));color:#fff;border-radius:50%;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.pr button{width:40px;height:44px;border:0;background:none;color:var(--ink);font-size:22px;font-weight:800;cursor:pointer;border-radius:50%}
.pr button:hover{background:rgba(255,45,138,.14);color:var(--pink)}
.champ{background:radial-gradient(70% 120% at 90% 20%,#8a1153 0,transparent 70%),var(--deep);color:#fff;border-radius:22px;padding:24px;margin-bottom:28px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.champ svg{width:110px;height:110px;flex:none}
.champ small{font-weight:800;color:var(--hl);font-size:14px}
.champ .cn{font:clamp(44px,11vw,80px)/1 Anton,sans-serif;margin:4px 0 10px;overflow-wrap:anywhere;color:var(--pink);text-transform:uppercase}
.champ ol{margin:0;padding-left:20px;font-size:15px;color:#ffd6e8}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;margin-bottom:32px}
.stat{font-size:14px;color:var(--mut);margin:-4px 0 16px;font-weight:600}
.conf{background:var(--card);border:2px solid var(--pink);border-radius:16px;padding:16px;margin-top:12px;max-width:560px}
.sc{display:block;width:100%;border:0;border-top:2px solid var(--line);background:rgba(255,45,138,.1);color:var(--pinkt);font:800 15px Inter,sans-serif;min-height:46px;cursor:pointer}
.sc:hover{background:var(--pink);color:#fff}
#ov{position:fixed;inset:0;z-index:50;background:radial-gradient(80% 50% at 50% 0,#3a0824 0,transparent 70%),var(--deep);color:#fff;overflow-y:auto}
.ovb{max-width:560px;margin:0 auto;padding:10px 12px 24px;display:flex;flex-direction:column;gap:8px}
.ovh{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;font-size:13px;font-weight:600;color:rgba(255,255,255,.65)}
.ovh .x{color:#fff}
.pl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.pp{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-top:4px solid transparent;border-radius:12px;padding:10px 12px;text-align:center}
.pp.on{background:rgba(255,45,138,.12);border-color:rgba(255,45,138,.35);border-top-color:var(--pink)}
.pp.won{border-top-color:var(--hl)}
.lg{font-size:12px;font-weight:600;color:rgba(255,255,255,.6);margin-top:2px}.lg b{color:#fff;font-weight:800;font-size:14px}
.pn{font-weight:800;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rem{font:clamp(44px,13vw,80px)/1 Anton,Impact,sans-serif;margin:4px 0 0;font-variant-numeric:tabular-nums}
.ck{font-size:13px;font-weight:800;color:var(--hl);min-height:20px}
.pp.on .ck{color:#fff}
.av{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.1)}
.av span{display:flex;flex-direction:column;font:700 16px Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums}
.av small{font-size:10px;letter-spacing:.08em;white-space:nowrap;color:rgba(255,255,255,.55);font-weight:700}
.disp{text-align:center;background:rgba(255,255,255,.05);border-radius:12px;padding:10px}
.disp small{font-size:13px;color:#f5bfd8;font-weight:600}
.disp .big{font:52px/1.1 Anton,Impact,sans-serif}
.msg{font-size:14px;font-weight:700;color:rgba(255,255,255,.85);min-height:21px;font-variant-numeric:tabular-nums}.msg .warn{color:var(--hl)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chips button{flex:none;min-height:44px;padding:0 14px;border-radius:999px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.07);color:#fff;font:800 15px Inter,sans-serif;cursor:pointer}
.chips button.uit{border-color:var(--hl);color:var(--hl)}
.pad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pad button{min-height:60px;border-radius:12px;border:0;background:rgba(255,255,255,.09);color:#fff;font:600 26px Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums;cursor:pointer}
.pad button:active{background:rgba(255,255,255,.2)}
.pad .ok{background:var(--pink);font-size:20px;font-weight:800}
#ov .btn{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18);color:#fff}
#ov .btn.pri{background:var(--pink);border-color:var(--pink)}
.mode{display:flex;background:rgba(255,255,255,.07);border-radius:999px;padding:4px;gap:4px}
.mode button{flex:1;min-height:36px;border:0;border-radius:999px;background:none;color:#f5bfd8;font:800 14px Inter,sans-serif;cursor:pointer}
.mode button.on{background:#fff;color:var(--deep)}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:8px 0 2px}
.slots span{min-height:44px;display:grid;place-items:center;border-radius:12px;border:2px dashed rgba(255,255,255,.2);color:rgba(255,255,255,.4);font-size:13px;font-weight:600}
.slots button{min-height:44px;border-radius:12px;border:2px solid var(--pink);background:rgba(255,45,138,.2);color:#fff;font:700 20px/1 Inter,system-ui,sans-serif;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px}
.slots button small{font:600 11px Inter,sans-serif;opacity:.75}
.slots button.ed{background:#fff;border-color:#fff;color:var(--deep)}.slots button.ed small{opacity:1;color:var(--deep)}
.dr{display:flex;align-items:center;justify-content:center;gap:10px;min-height:40px;margin-top:4px}
.done{margin:0;min-height:40px;padding:0 18px;border-radius:999px;border:1px solid rgba(255,255,255,.25);background:none;color:#fff;font:800 14px Inter,sans-serif;cursor:pointer}
.mods{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mods button{min-height:44px;border-radius:12px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.04);color:#fff;font:700 15px Inter,sans-serif;cursor:pointer}
.mods button.on{background:var(--pink);border-color:var(--pink);color:#fff}
.nums{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.nums button{min-height:46px;border-radius:12px;border:0;background:rgba(255,255,255,.09);color:#fff;font:600 20px Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums;cursor:pointer;padding:0}
.nums button:active{background:rgba(255,255,255,.22)}
.nums .w2{grid-column:span 2;font-size:17px}
.nums .w1{background:rgba(255,255,255,.04)}
.hist em{font-style:normal;opacity:.7;font-size:12px;margin-left:6px}
.kind{background:var(--card);border:2px solid var(--line);max-width:520px;margin-bottom:22px}
.kind button{color:var(--mut);min-height:44px;font-size:15px;padding:0 8px}
.kind button.on{background:var(--pink);color:#fff}
.ovr{display:flex;align-items:center;gap:4px}
.snd{white-space:nowrap;flex:none;display:flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;border-radius:999px;border:1px solid rgba(255,255,255,.18);background:none;color:#fff;font:700 13px Inter,sans-serif;cursor:pointer}
.snd.on{background:rgba(255,255,255,.1)}
.sheet{display:flex;flex-direction:column;gap:10px}
.sheet h3{font:24px Anton,Impact,sans-serif;margin:8px 0 0;text-transform:uppercase;color:var(--pink)}
.hint{margin:0;font-size:14px;color:#f5bfd8}
.clips{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.clips li{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.06);border-radius:14px;padding:8px 8px 8px 14px}
.clips li>div{flex:1;display:flex;flex-direction:column}
.clips small{font-size:12px;color:#f5bfd8}
.clips button,.pick{min-width:44px;min-height:44px;display:grid;place-items:center;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:none;color:#fff;font:800 14px Inter,sans-serif;cursor:pointer;padding:0 10px}
.pick{background:var(--pink);border-color:var(--pink)}
.clips button:disabled{opacity:.3;cursor:default}
.hist{list-style:none;margin:0;padding:0;font-size:14px;color:#f5bfd8}
.hist li{display:flex;justify-content:space-between;padding:6px 4px;border-bottom:1px solid rgba(255,255,255,.08)}
.hist b{color:#fff}
.wonb{text-align:center;padding:12px 0}
.wonb small{color:var(--hl);font-weight:800}
.wonb .cn{font:clamp(44px,12vw,72px)/1 Anton,sans-serif;color:var(--pink);text-transform:uppercase;overflow-wrap:anywhere}
.wonb .row{justify-content:center;margin-top:10px}
@media(max-width:600px){.hin{grid-template-columns:1fr;padding-top:16px}.logo{max-height:230px;order:-1;margin:0 auto}h1 span{display:inline}}
.tbl{width:100%;max-width:680px;border-collapse:separate;border-spacing:0;background:var(--card);border:2px solid var(--line);border-radius:16px;overflow:hidden;font-variant-numeric:tabular-nums;margin-bottom:8px;font-size:14px}
.tbl th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);font-weight:800;text-align:center;padding:10px 4px;border-bottom:2px solid var(--line)}
.tbl td{text-align:center;padding:10px 4px;border-bottom:1px solid var(--line);font-weight:600}
.tbl tr:last-child td{border-bottom:0}
.tbl .tn{text-align:left;font-weight:800;width:38%;max-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbl .pt{font:20px Anton,Impact,sans-serif;color:var(--pinkt)}
.rk{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;font:16px Anton,Impact,sans-serif}
.rk.one{background:var(--pink);color:#fff}
.rd{font:20px Anton,Impact,sans-serif;color:var(--pinkt);text-transform:uppercase;margin:20px 0 10px;letter-spacing:.02em}
.hu{font-size:11px;color:var(--mut);font-weight:600;margin-left:4px}
nav:empty{display:none}
.monb{display:flex;flex-direction:column;gap:12px;margin-top:32px;padding-top:20px;border-top:2px solid var(--line);color:var(--mut);font-size:14px;font-weight:600;max-width:680px}
.monb h3{font:20px Anton,Impact,sans-serif;text-transform:uppercase;color:var(--ink);margin:0}
.lk{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lk code{font:600 14px ui-monospace,Menlo,Consolas,monospace;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:8px 10px;color:var(--ink);flex:1 1 220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lk .btn{min-height:40px;padding:0 14px;font-size:14px}
.login{max-width:440px;display:grid;gap:12px}
.login p{margin:0;color:var(--mut)}
.err{color:#e0245e;font-weight:700;min-height:1.4em}
.net{position:fixed;left:12px;bottom:12px;z-index:90;background:#ff5a5a;color:#fff;font:800 13px Inter,sans-serif;padding:8px 12px;border-radius:999px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
body.tvm{overflow:hidden;background:var(--deep)}
body.tvm .hero,body.tvm main,body.tvm #ov{display:none!important}
#tv{position:fixed;inset:0;z-index:60;background:radial-gradient(70% 50% at 50% 0,#3a0824 0,transparent 70%),var(--deep);color:#fff;overflow:hidden;font-variant-numeric:tabular-nums}
#tv .btn{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18);color:#fff}
#tv .btn.pri{background:var(--pink);border-color:var(--pink)}
.tvs{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px}
.tvs .tvlogo{width:min(40vw,360px)}
.tvs h1{font-size:clamp(40px,7vw,96px)}.tvs h1 span{display:inline}
.tvs p{color:rgba(255,255,255,.7);max-width:48ch;margin:0}
.tvc{font-weight:700}
.dot{display:inline-block;width:.6em;height:.6em;border-radius:50%;background:#999;margin-right:.4em;vertical-align:middle}.dot.ok{background:#3ddc84}.dot.bad{background:#ff5a5a}
.tvw{height:100%;display:flex;flex-direction:column;padding:2vh 3vw;gap:2vh}
.tvt{display:flex;align-items:center;gap:1.2vw;font-size:clamp(14px,1.6vw,28px)}
.tvt svg{width:4vw;height:4vw;min-width:40px;min-height:40px;flex:none}
.tvt b{font:clamp(20px,2.4vw,44px) Anton,Impact,sans-serif;text-transform:uppercase;letter-spacing:.02em;font-weight:400}.tvt b span{color:var(--pink)}
.tvt em{font-style:normal;color:rgba(255,255,255,.65);font-weight:600;flex:1}
.tvt i{font-style:normal;font-weight:700;color:rgba(255,255,255,.8);white-space:nowrap}
.tvm2{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr auto;gap:2vh 2vw;min-height:0}
.tvp{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-top:.8vh solid transparent;border-radius:2vw;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2vh 2vw;min-height:0;min-width:0}
.tvp.on{background:rgba(255,45,138,.14);border-color:rgba(255,45,138,.4);border-top-color:var(--pink)}
.tvp.won{border-top-color:var(--hl)}
.tvn{font:800 clamp(24px,3.6vw,72px)/1.1 Inter,system-ui,sans-serif;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tvl{font-weight:700;font-size:clamp(14px,1.8vw,34px);color:rgba(255,255,255,.65);letter-spacing:.08em;margin-top:.6vh}.tvl b{color:#fff}
.tvr{font:min(17vw,30vh)/1 Anton,Impact,sans-serif;margin:1vh 0}
.tvck{font-weight:800;font-size:clamp(16px,2.2vw,40px);color:var(--hl);min-height:1.3em;letter-spacing:.04em}
.tvst{display:flex;gap:4vw;margin-top:1.5vh;padding-top:1.5vh;border-top:1px solid rgba(255,255,255,.12)}
.tvst span{display:flex;flex-direction:column;align-items:center;font-weight:800;font-size:clamp(18px,2.4vw,44px)}
.tvst small{font-size:clamp(10px,.9vw,16px);letter-spacing:.1em;color:rgba(255,255,255,.55)}
.tvd{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:1vh 2vw;background:rgba(255,255,255,.04);border-radius:1.4vw;padding:1.5vh 2vw;font-size:clamp(16px,2vw,36px)}
.tvd small{color:rgba(255,255,255,.7);font-weight:600;font-size:inherit}
.tvd b{font-weight:800}
.tvsl{display:flex;gap:1vw}
.tvsl span{min-width:7vw;padding:.6vh 1vw;border:2px dashed rgba(255,255,255,.2);border-radius:1vw;font-weight:800;font-size:clamp(18px,2.6vw,48px);min-height:1.6em;text-align:center}
.tvsl span.f{border:2px solid var(--pink);background:rgba(255,45,138,.2)}
.tvh{list-style:none;margin:0;padding:0;display:flex;gap:1vw;overflow:hidden;font-size:clamp(12px,1.3vw,24px);color:rgba(255,255,255,.7)}
.tvh li{display:flex;gap:.6vw;background:rgba(255,255,255,.05);border-radius:999px;padding:.6vh 1.2vw;white-space:nowrap}.tvh b{color:#fff}
.tvo{flex:1;display:grid;grid-template-columns:1.4fr 1fr;gap:3vw;min-height:0}
.tvo h2,.tvh2{font-size:clamp(24px,3vw,56px);margin:0 0 1.5vh;color:#fff}
.tvtb{max-width:none;background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.1);font-size:clamp(14px,1.7vw,32px);color:#fff}

<script>
{
const KEY='dartstruners-v1',PINKEY='dartstruners-pin';
const DEF=()=>({players:[],started:false,seeds:[],bo:3,boF:5,results:{},name:'',turns:{},game:501,dout:1,inmode:'pijl',kind:'toernooi',single:{names:['',''],bo:3},sound:1,voice:'nl',lot:1,comp:{players:[],started:false}});
let S=DEF();
let tab='spelers',confirmReset=false;
let tv=false,tvOn=false,tvSound=false,tvGot=false,tvSlow=false,tvEv=0,tvFx=null,tvFxT=0,tvTO=0,sender=false,pushT=0,wBusy=false,wNext=false,wLast='',evs=[],evN=0;
let kijkTab='live';
let admin=false,ready=false,pin='',ver=0,netOk=null,loginErr='',role='admin';
const ADM=()=>role==='admin';
const myId=Math.random().toString(36).slice(2,10);
const PATH=(location.pathname.replace(/\/+$/,'')||'/').toLowerCase();
const KIJK=PATH==='/kijk';
if(PATH==='/monitor'||KIJK)tv=true;
if(KIJK){tvOn=true;tvSound=false;document.body.classList.add('kijk')}
try{pin=localStorage.getItem(PINKEY)||''}catch(e){}
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.players))S=Object.assign(DEF(),s)}catch(e){}
try{const h=location.hash.slice(1);if(h)tab=h}catch(e){}
const save=()=>{if(tv||!admin)return;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}sender=true;push()};
const keepC=o=>Object.fromEntries(Object.entries(o||{}).filter(([k])=>k[0]==='C'));
const clearC=()=>{for(const o of [S.results,S.turns])for(const k of Object.keys(o))if(k[0]==='C')delete o[k]};
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- bracketstructuur ---------- */
function seedOrder(n){let a=[1];while(a.length<n){const L=a.length*2+1,b=[];a.forEach(s=>b.push(s,L-s));a=b}return a}
function build(n){
  const size=Math.max(2,2**Math.ceil(Math.log2(n))),k=Math.log2(size);
  const M={},W=[],L=[];
  const add=(id,br,r,i,A,B,lab)=>{M[id]={id,br,r,i,A,B,lab};return id};
  const so=seedOrder(size);
  for(let r=1;r<=k;r++){const ids=[];
    for(let j=0;j<size/2**r;j++){const id='W'+r+'.'+(j+1);
      if(r===1)add(id,'W',r,j,{t:'p',i:so[2*j]-1},{t:'p',i:so[2*j+1]-1});
      else add(id,'W',r,j,{t:'w',m:W[r-2][2*j]},{t:'w',m:W[r-2][2*j+1]});
      ids.push(id)}
    W.push(ids)}
  let lbChamp;
  if(k>=2){
    let lr=1,ids=[];
    for(let j=0;j<size/4;j++){const id='L1.'+(j+1);add(id,'L',1,j,{t:'l',m:W[0][2*j]},{t:'l',m:W[0][2*j+1]});ids.push(id)}
    L.push(ids);
    for(let r=2;r<=k;r++){
      const c=size/2**r;lr++;ids=[];
      for(let j=0;j<c;j++){const jj=r%2===0?c-1-j:j,id='L'+lr+'.'+(j+1);
        add(id,'L',lr,j,{t:'w',m:L[L.length-1][j]},{t:'l',m:W[r-1][jj]});ids.push(id)}
      L.push(ids);
      if(r<k){lr++;const ids2=[];
        for(let j=0;j<c/2;j++){const id='L'+lr+'.'+(j+1);add(id,'L',lr,j,{t:'w',m:ids[2*j]},{t:'w',m:ids[2*j+1]});ids2.push(id)}
        L.push(ids2)}
    }
    lbChamp={t:'w',m:L[L.length-1][0]};
  }else lbChamp={t:'l',m:W[0][0]};
  add('F','F',1,0,{t:'w',m:W[k-1][0]},lbChamp,'Finale');
  return{M,W,L,k,n};
}
function solve(B){
  const memo={};
  const src=s=>s.t==='p'?(s.i<B.n?s.i:'BYE'):(s.t==='w'?get(s.m).win:get(s.m).los);
  function get(id){
    if(memo[id])return memo[id];
    const m=B.M[id],a=src(m.A),b=src(m.B),need=Math.ceil((id==='F'?S.boF:S.bo)/2);
    let o={a,b,sa:0,sb:0,win:null,los:null,need,bye:a==='BYE'||b==='BYE'};
    if(a==='BYE'){o.win=b;o.los='BYE'}
    else if(b==='BYE'){o.win=a;o.los='BYE'}
    else if(a!==null&&b!==null){
      const r=S.results[id];
      if(r&&r.a===a&&r.b===b){o.sa=r.sa;o.sb=r.sb;
        if(r.sa>=need){o.win=a;o.los=b}else if(r.sb>=need){o.win=b;o.los=a}}
    }
    o.ready=typeof a==='number'&&typeof b==='number'&&o.win===null;
    return memo[id]=o;
  }
  Object.keys(B.M).forEach(get);
  return memo;
}

/* ---------- dartscorebord ---------- */
let openId=null,buf='',msg='',darts=[],mod=1,edit=null;
const DBL=[20,16,18,12,10,8,19,17,14,15,13,11,9,7,6,5,4,3,2,1];
const ALL=(()=>{const a=[];for(let i=20;i>=1;i--)a.push(['T'+i,3*i]);a.push(['Bull',50],['25',25]);for(let i=20;i>=1;i--)a.push([''+i,i]);return a})();
const LAST=()=>S.dout?[...DBL.map(d=>['D'+d,2*d]),['Bull',50]]:ALL;
function checkout(rem,n=3){
  if(rem>(n===3?170:n===2?110:50)||rem<1)return'';
  const L=LAST();
  for(const[n,v]of L)if(v===rem)return n;
  if(n>1)for(const[d,dv]of L)for(const[x,xv]of ALL)if(xv+dv===rem)return x+' '+d;
  if(n<3)return'';
  for(const[x,xv]of ALL)for(const[y,yv]of ALL)for(const[d,dv]of L)if(xv+yv+dv===rem)return x+' '+y+' '+d;
  return'';
}
function isC(id){return typeof id==='string'&&id[0]==='C'}
function getO(id){
  if(isC(id)){const m=cMatches()[+id.slice(1)];if(!m)return null;const r=S.results[id],ok=r&&r.a===m.h&&r.b===m.u,sa=ok?r.sa:0,sb=ok?r.sb:0;
    return{a:m.h,b:m.u,sa,sb,need:3,win:sa>=3?m.h:sb>=3?m.u:null,los:sa>=3?m.u:sb>=3?m.h:null}}
  if(id==='X'){const r=S.results.X||{sa:0,sb:0},need=Math.ceil(S.single.bo/2);
    return{a:0,b:1,sa:r.sa,sb:r.sb,need,win:r.sa>=need?0:r.sb>=need?1:null}}
  return R&&R[id];
}
const pn=p=>openId==='X'?esc(S.single.names[p]):isC(openId)?esc(S.comp.players[p]):nm(p);
function live(id){
  const o=getO(id);let r=S.results[id];if(!r||r.a!==o.a||r.b!==o.b)r={a:o.a,b:o.b,sa:0,sb:0};
  let t=S.turns[id];if(!t||t.a!==o.a||t.b!==o.b)t=S.turns[id]={a:o.a,b:o.b,list:[]};
  const leg=r.sa+r.sb,lt=t.list.filter(x=>x.leg===leg);
  const rem=[0,1].map(s=>S.game-lt.filter(x=>x.side===s&&!x.bust).reduce((q,x)=>q+x.score,0));
  const cur=(leg+lt.length)%2;
  const st=[0,1].map(s=>{const m=t.list.filter(x=>x.side===s),sc=m.filter(x=>!x.bust).reduce((q,x)=>q+x.score,0);
    return{avg:m.length?(sc/m.length).toFixed(1):'–',last:m.length?(m[m.length-1].bust?'bust':m[m.length-1].score):'–',darts:lt.filter(x=>x.side===s).length*3}});
  return{o,r,t,leg,lt,rem,cur,st};
}

function say(t,cut){
  if(!tv&&t)ev({k:'say',t:String(t),cut:!!cut});
  if(tv?!tvSound:!S.sound)return;
  try{if(cut)speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);
    if(caller()){u.lang='en-GB';if(vEN)u.voice=vEN;u.rate=.9;u.pitch=.8}else{u.lang='nl-NL';if(vNL)u.voice=vNL;u.rate=1.05}

function play(evk,text){

}

function idb(){return new Promise((res,rej)=>{try{const r=indexedDB.open('toernooi-geluid',1);r.onupgradeneeded=()=>r.result.createObjectStore('clips');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
async function clipPut(k,blob){if(clipUrl[k])URL.revokeObjectURL(clipUrl[k]);clipUrl[k]=URL.createObjectURL(blob);

async function clipDel(k){if(clipUrl[k])URL.revokeObjectURL(clipUrl[k]);delete clipUrl[k];

  const rem=L.rem[L.cur],bust=v>rem||(S.dout&&rem-v===1)||(ds&&v===rem&&S.dout&&!ds[ds.length-1].dbl),out=!bust&&v===rem;

  else msg=bust?(ds&&v===rem?`Bust! Uitgooien moet op een dubbel. ${who} blijft op ${rem}`:`Bust! ${who} blijft op ${rem}`):'';

let ctab='stand',cConf=false,pasteOpen=false;
function cMatches(){
  const n=S.comp.players.length;if(n<2)return[];
  const ids=[...Array(n).keys()];if(n%2)ids.push(-1);
  const m=ids.length,R=m-1,out=[];let arr=ids.slice();
  for(let r=0;r<R;r++){
    for(let i=0;i<m/2;i++){let a=arr[i],b=arr[m-1-i];if(a<0||b<0)continue;if((r+i)%2)[a,b]=[b,a];out.push({h:a,u:b,rd:r+1})}
    arr=[arr[0],arr[m-1],...arr.slice(1,m-1)]}
  const first=out.length;for(let k=0;k<first;k++){const x=out[k];out.push({h:x.u,u:x.h,rd:x.rd+R})}
  return out;
}
function cStand(){
  const P=S.comp.players,T=P.map((n,i)=>({i,n,g:0,w:0,l:0,lf:0,la:0,pt:0}));
  cMatches().forEach((m,k)=>{const o=getO('C'+k);if(o.win===null)return;const h=T[m.h],u=T[m.u];
    h.g++;u.g++;h.lf+=o.sa;h.la+=o.sb;u.lf+=o.sb;u.la+=o.sa;const W=o.win===m.h?h:u,Lo=o.win===m.h?u:h;W.w++;W.pt+=2;Lo.l++});
  return T.sort((a,b)=>b.pt-a.pt||(b.lf-b.la)-(a.lf-a.la)||b.lf-a.lf||a.n.localeCompare(b.n));
}

function importFile(f){const r=new FileReader();r.onload=()=>importText(String(r.result));r.readAsText(f)}
function importText(txt){
  {try{

    if(!d||!Array.isArray(d.players))throw new Error('Dit is geen bestand van De Dart Struners.');

/* ---------- verbinding met de server ---------- */
function setNet(ok){netOk=ok;const n=document.getElementById('net');if(n)n.hidden=ok!==false||tv;if(tv)renderTV()}
function ev(o){if(tv)return;o.id=Date.now()*100+(evN++%100);evs.push(o);if(evs.length>8)evs=evs.slice(-8);push()}
function push(){if(tv||!admin||!sender)return;clearTimeout(pushT);pushT=setTimeout(flush,120)}
async function flush(){
  if(tv||!admin)return;
  if(wBusy){wNext=true;return}
  const j=JSON.stringify({S,live:{openId:openId||null,darts,msg,evs},by:myId});
  if(j===wLast)return;
  wBusy=true;let ok=false;
  try{const r=await fetch('/api/state',{method:'POST',headers:{'Content-Type':'application/json','X-Pin':pin},body:j});
    if(r.ok){wLast=j;const d=await r.json();ver=d.v;ok=true}
    else if(r.status===401){logout('De beheerderscode klopt niet meer. Log opnieuw in.')}
  }catch(e){}
  wBusy=false;setNet(ok);
  if(wNext){wNext=false;flush()}
  else if(!ok&&admin)setTimeout(flush,3000);
}
async function loadState(){
  try{const r=await fetch('/api/state',{cache:'no-store'});const d=await r.json();setNet(true);
    if(d&&d.S&&Array.isArray(d.S.players)){S=Object.assign(DEF(),d.S);ver=d.v||0;sender=false;clearTimeout(pushT);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
    return true}catch(e){setNet(false);return false}
}
async function login(p){
  loginErr='';

    if(r.ok){const d0=await r.json().catch(()=>({}));role=d0.role==='teller'?'teller':'admin';pin=p;try{localStorage.setItem(PINKEY,p)}catch(e){}admin=true;await loadState();ready=true;render();window.scrollTo(0,0);return true}
    const d=await r.json().catch(()=>({}));loginErr=d.error||'Inloggen mislukt';
  }catch(e){loginErr='Geen verbinding met de server'}

}

function applyRemote(c){
  if(!c||!c.S||typeof c.S!=='object'||!Array.isArray(c.S.players))return;
  S=Object.assign(DEF(),c.S);
  if(!S.comp||!Array.isArray(S.comp.players))S.comp={players:[],started:false};
  if(!S.results||typeof S.results!=='object')S.results={};
  if(!S.turns||typeof S.turns!=='object')S.turns={};
  const L=c.live||{};
  openId=typeof L.openId==='string'?L.openId:null;
  darts=Array.isArray(L.darts)?L.darts.filter(x=>x&&typeof x.lab==='string').map(x=>({lab:x.lab,v:+x.v||0,dbl:!!x.dbl})):[];
  msg=typeof L.msg==='string'?L.msg:'';
  const E=Array.isArray(L.evs)?L.evs.filter(x=>x&&typeof x.id==='number'):[];
  if(!tvGot){tvGot=true;tvEv=E.reduce((m,x)=>Math.max(m,x.id),tvEv)}
  else E.filter(x=>x.id>tvEv).sort((a,b)=>a.id-b.id).forEach(x=>{tvEv=Math.max(tvEv,x.id);
    if(x.k==='say'&&typeof x.t==='string')say(x.t.slice(0,200),x.cut);
    else if(FXK.includes(x.k)){tvFx={k:x.k,who:String(x.who||'').slice(0,40),v:+x.v||0};clearTimeout(tvFxT);tvFxT=setTimeout(()=>{tvFx=null;renderTV()},2600)}});
  try{refresh()}catch(e){}
}
// Live bijwerken met 'long polling': de server antwoordt zodra er iets verandert
async function stream(){
  let v=-1;
  for(;;){
    try{
      const r=await fetch('/api/wait?v='+v+'&c='+myId,{cache:'no-store'});
      if(!r.ok)throw new Error(r.status);
      const d=await r.json();
      clearTimeout(tvTO);tvSlow=false;setNet(true);
      const changed=d.v!==v;v=d.v;
      if(tv){if(changed||!tvGot){applyRemote(d);renderTV()}continue}
      // Beheerder op een ander apparaat heeft iets veranderd: haal de volledige stand op
      if(changed&&admin&&d.by&&d.by!==myId&&d.v>ver&&!openId&&!wBusy){await loadState();render()}
    }catch(e){setNet(false);await new Promise(r=>setTimeout(r,2000))}
  }
}

/* ---------- monitor- en meekijkweergave ---------- */
const TVLOGO='<use href="#ball" transform="translate(300 180) scale(1.12)"/><use href="#dart" transform="translate(246 156) rotate(25) scale(1.3)"/>';
function tvTable(T){
  return`<table class="tbl tvtb"><thead><tr><th>#</th><th class="tn">Speler</th><th>G</th><th>W</th><th>V</th><th>Legs</th><th>+/−</th><th>Pnt</th></tr></thead><tbody>${T.map((r,i)=>{const d=r.lf-r.la;return`<tr><td><span class="rk${i===0&&r.pt>0?' one':''}">${i+1}</span></td><td class="tn">${esc(r.n)}</td><td>${r.g}</td><td>${r.w}</td><td>${r.l}</td><td>${r.lf}–${r.la}</td><td>${d>0?'+'+d:d}</td><td class="pt">${r.pt}</td></tr>`}).join('')}</tbody></table>`;
}
function tvMatch(){
  const L=live(openId),o=L.o,done=o.win!==null,ps=[o.a,o.b],bo=openId==='X'?S.single.bo:isC(openId)?5:openId==='F'?S.boF:S.bo;
  const dsum=darts.reduce((q,x)=>q+x.v,0),rem=L.rem.slice();if(!done)rem[L.cur]-=dsum;
  let nmR=openId;
  if(openId==='X')nmR='1 tegen 1';else if(isC(openId)){const m=cMatches()[+openId.slice(1)];nmR='Competitie · ronde '+(m?m.rd:'')}
  else if(openId==='F')nmR='Finale';else if(B&&B.M[openId]){const m=B.M[openId];nmR=roundName(m.br,m.r,(m.br==='W'?B.W:B.L).length)}
  const ctx=`${nmR} · best of ${bo} legs · ${S.game} · ${S.dout?'dubbel uit':'enkel uit'}`;
  const side=i=>{const on=!done&&L.cur===i,won=done&&o.win===ps[i],legs=i?L.r.sb:L.r.sa,ck=on?checkout(rem[i],3-darts.length):'';
    return`<div class="tvp${on?' on':''}${won?' won':''}"><div class="tvn">${pn(ps[i])}</div><div class="tvl">LEGS <b>${legs}</b></div><div class="tvr">${rem[i]}</div><div class="tvck">${won?'WINNAAR':ck?'UIT: '+ck:on?'AAN DE BEURT':'&nbsp;'}</div><div class="tvst"><span><small>GEMIDDELD</small>${L.st[i].avg}</span><span><small>LAATSTE</small>${L.st[i].last}</span></div></div>`};
  const turn=done?`<div class="tvd"><b>${pn(o.win)} wint met ${L.r.sa} – ${L.r.sb}</b></div>`
    :`<div class="tvd"><small>${pn(ps[L.cur])} gooit · leg ${L.leg+1}</small>${S.inmode==='pijl'?`<div class="tvsl">${[0,1,2].map(i=>`<span class="${darts[i]?'f':''}">${darts[i]?esc(darts[i].lab):''}</span>`).join('')}</div><b>${dsum?'Deze beurt '+dsum:''}</b>`:''}</div>`;
  const hist=L.lt.slice(-8).reverse().map(x=>`<li><span>${pn(ps[x.side])}</span><b>${x.bust?'BUST':x.score}</b></li>`).join('');
  const main=`<div class="tvm2">${side(0)}${side(1)}${turn}</div>${hist?`<ul class="tvh">${hist}</ul>`:''}`;
  if(!isC(openId)||!S.comp.started)return{ctx,html:main};
  const T=cStand();
  return{ctx,html:`<div class="tvsp"><div class="tvmn">${main}</div><aside class="tvsd"><h3>Live stand</h3><table class="tvmini"><thead><tr><th>#</th><th class="tn">SPELER</th><th>W</th><th>+/−</th><th>PNT</th></tr></thead><tbody>${T.map((r,i)=>{const d=r.lf-r.la;return`<tr class="${ps.includes(r.i)?'me':''}"><td>${i+1}</td><td class="tn">${esc(r.n)}</td><td>${r.w}</td><td>${d>0?'+'+d:d}</td><td class="pt">${r.pt}</td></tr>`}).join('')}</tbody></table><p class="tvsdn"><i></i>speelt nu</p></aside></div>`};
}
function tvOverview(){
  if(S.kind==='comp'&&S.comp.started){
    const M=cMatches(),T=cStand(),done=M.filter((m,k)=>getO('C'+k).win!==null).length;
    const nx=M.map((m,k)=>({m,k})).filter(x=>getO('C'+x.k).win===null).slice(0,6);
    const right=nx.length?`<h2>Volgende wedstrijden</h2><ul class="tvnx">${nx.map(x=>`<li><small>Ronde ${x.m.rd}</small><span>${esc(S.comp.players[x.m.h])}</span><em>–</em><span>${esc(S.comp.players[x.m.u])}</span></li>`).join('')}</ul>`
      :`<div class="tvch"><small>Kampioen</small><div>${esc(T[0].n)}</div></div>`;
    return{ctx:`Competitie · ${done} van ${M.length} wedstrijden gespeeld · winst = 2 punten`,html:`<div class="tvo"><div><h2>Stand</h2>${tvTable(T)}</div><div>${right}</div></div>`};
  }
  if(S.kind==='toernooi'&&S.started&&B&&R){
    const all=Object.keys(B.M).filter(id=>!R[id].bye),ready=all.filter(id=>R[id].ready),done=all.filter(id=>R[id].win!==null).length;
    if(R.F.win!==null)return{ctx:'Toernooi afgelopen',html:`<div class="tvch"><small>Kampioen</small><div>${nm(R.F.win)}</div></div>`};
    return{ctx:`Toernooi · ${done} van ${all.length} wedstrijden gespeeld`,html:`<h2 class="tvh2">Nu te spelen</h2>${ready.length?`<div class="tvg">${ready.map(id=>{const o=R[id],m=B.M[id];return`<div class="tvc2"><small>${id==='F'?'Finale':roundName(m.br,m.r,(m.br==='W'?B.W:B.L).length)}</small><div><span>${nm(o.a)}</span><b>${o.sa} – ${o.sb}</b><span>${nm(o.b)}</span></div></div>`}).join('')}</div>`:'<p class="tvempty">Even wachten op de volgende ronde.</p>'}`};
  }
  return{ctx:'',html:`<div class="tvch"><small>Wachten op de volgende wedstrijd</small><div class="tvwait">Er is op dit moment geen wedstrijd bezig</div></div>`};
}
function fxHtml(){
  const d=tvFx,w=esc(d.who);
  const big=d.k==='180'?'180':d.k==='ton'?esc(String(d.v)):d.k==='bust'?'BUST':'GAME SHOT';
  const sub=d.k==='leg'?'Leg voor '+w:d.k==='match'?w+' wint de wedstrijd!':w;
  return`<div class="tvfx k-${d.k}"><div>${big}</div><small>${sub}</small></div>`;
}
function kRow(id,small,h,u,o,isNow){
  const done=o&&o.win!==null,hw=done&&o.win===o.a;
  const mid=o&&(done||o.sa||o.sb)?`<b>${o.sa} – ${o.sb}</b>`:'–';
  return`<li class="${done?'done':''}${isNow?' now':''}"><small>${esc(small)}${isNow?' · nu bezig':''}</small><span class="${done?(hw?'w':'l'):''}">${h}</span><em>${mid}</em><span class="${done?(hw?'l':'w'):''}">${u}</span></li>`;
}
function kStand(){
  if(S.kind==='comp'&&S.comp.started){const M=cMatches(),done=M.filter((m,k)=>getO('C'+k).win!==null).length;
    return`<h2 class="tvh2">Stand</h2><p class="kempty" style="margin:-4px 0 12px">${done} van ${M.length} wedstrijden gespeeld · winst = 2 punten</p>${tvTable(cStand())}<p class="kempty" style="margin-top:8px">G = gespeeld · W = gewonnen · V = verloren</p>`}
  return'<p class="kempty">Er loopt op dit moment geen competitie.</p>';
}
function kMatches(){
  if(S.kind==='comp'&&S.comp.started){
    const M=cMatches(),P=S.comp.players,rounds={};M.forEach((m,k)=>{(rounds[m.rd]=rounds[m.rd]||[]).push(k)});
    const next=Object.keys(rounds).find(r=>rounds[r].some(k=>getO('C'+k).win===null));
    return Object.keys(rounds).map(r=>`<h3 class="kh">Ronde ${r}${r===next?' · aan de beurt':''}</h3><ul class="tvnx">${rounds[r].map(k=>kRow('C'+k,'thuis – uit',esc(P[M[k].h]),esc(P[M[k].u]),getO('C'+k),openId==='C'+k)).join('')}</ul>`).join('');
  }
  if(S.kind==='toernooi'&&S.started&&B&&R){
    const lab=s=>typeof s==='number'?nm(s):'<i style="font-weight:400;opacity:.6">nog onbekend</i>';
    const sec=(rounds,br)=>rounds.map((ids,ri)=>{const vis=ids.filter(id=>!R[id].bye);if(!vis.length)return'';
      return`<h3 class="kh">${roundName(br,ri+1,rounds.length)}</h3><ul class="tvnx">${vis.map(id=>{const o=R[id];return kRow(id,'Best of '+S.bo,lab(o.a),lab(o.b),o,openId===id)}).join('')}</ul>`}).join('');
    const f=R.F;
    return sec(B.W,'W')+(B.L.length?sec(B.L,'L'):'')+`<h3 class="kh">Finale</h3><ul class="tvnx">${kRow('F','Best of '+S.boF,lab(f.a),lab(f.b),f,openId==='F')}</ul>`;
  }
  return'<p class="kempty">Er loopt op dit moment geen toernooi of competitie.</p>';
}
function renderTV(){
  const el=document.getElementById('tv');if(!el)return;
  document.body.classList.add('tvm');el.hidden=false;document.getElementById('ov').hidden=true;
  const con=netOk===false||tvSlow?'<span class="dot bad"></span>Geen verbinding':tvGot?'<span class="dot ok"></span>Live':'<span class="dot"></span>Verbinden…';
  if(!tvOn){el.innerHTML=`<div class="tvs"><svg class="tvlogo" viewBox="0 0 460 320" aria-hidden="true">${TVLOGO}</svg><h1>De Dart <span>Struners</span></h1><p>Monitor-weergave. Wat op de telefoon wordt ingevuld, verschijnt hier live.</p><div class="row" style="justify-content:center"><button class="btn pri" data-a="tvgo">Start met geluid</button><button class="btn" data-a="tvgo0">Start zonder geluid</button></div><p class="tvc">${con}</p><button class="done" data-a="tvstop">Naar de app</button></div>`;return}
  let c;
  try{
    if(!tvGot)c={ctx:'',html:`<div class="tvch"><small>Verbinden</small><div class="tvwait">Even geduld, de stand wordt opgehaald</div></div>`};
    else if(KIJK&&kijkTab==='stand')c={ctx:'',html:`<div class="kscroll">${kStand()}</div>`};
    else if(KIJK&&kijkTab==='wedstrijden')c={ctx:'',html:`<div class="kscroll"><h2 class="tvh2">Wedstrijden</h2>${kMatches()}</div>`};
    else{const go=openId&&getO(openId);c=go&&typeof go.a==='number'&&typeof go.b==='number'?tvMatch():tvOverview()}
  }catch(e){c={ctx:'',html:'<div class="tvch"><small>Even geduld</small></div>'}}
  el.innerHTML=`<div class="tvw"><div class="tvt"><svg viewBox="-240 -170 360 300" aria-hidden="true"><use href="#ball"/><use href="#dart" transform="translate(-62 -48) rotate(32)"/></svg><b>De Dart <span>Struners</span></b><em>${esc(c.ctx)}</em><i>${con}</i></div>${KIJK&&tvGot?`<div class="ktabs">${[['live','Live'],['stand','Stand'],['wedstrijden','Wedstrijden']].filter(([k])=>k!=='stand'||(S.kind==='comp'&&S.comp.started)).map(([k,l])=>`<button data-ktab="${k}" class="${kijkTab===k?'on':''}">${l}</button>`).join('')}</div>`:''}${c.html}</div>${tvFx?fxHtml():''}<button class="tvx" data-a="tvstop" aria-label="Monitor-weergave sluiten">×</button>`;
}

/* ---------- opstarten ---------- */
(async()=>{
  if(tv){tvTO=setTimeout(()=>{tvSlow=true;renderTV()},10000);renderTV();stream();return}
  try{const r=await fetch('/api/info',{cache:'no-store'});const d=await r.json();if(d&&typeof d.publicUrl==='string'&&/^https:\/\//.test(d.publicUrl))publicUrl=d.publicUrl}catch(e){}
  if(pin){await login(pin)}else{await loadState();ready=true;render()}
  stream();
})();
}

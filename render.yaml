services:
  - type: web
    name: dart-struners
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: ADMIN_PIN
        sync: false
      - key: DATA_DIR
        value: /var/data
      - key: NODE_ENV
        value: production
    disk:
      name: stand
      mountPath: /var/data
      sizeGB: 1
